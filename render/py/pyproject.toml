# The newscast's phonemiser for headlines read in another language (render/py/phonemize.py,
# called by render/src/speech.mjs). Not a package: uv runs the script in this project's
# environment, pinned by uv.lock:
#
#   uv run --project render/py --locked --quiet python -I render/py/phonemize.py
#
# speech.mjs puts the environment in render/.cache/py (UV_PROJECT_ENVIRONMENT, gitignored).
# misaki 0.9.4 is the front end the Python kokoro package uses for Kokoro 1.0: espeak-ng (the
# library and its data come inside the espeakng-loader wheel) for Spanish, French, Italian,
# Brazilian Portuguese and Hindi, cutlet (fugashi with unidic-lite) for Japanese, and jieba with
# pypinyin for Mandarin. misaki requires Python < 3.13.
[project]
name = "today-on-earth-phonemize"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "misaki==0.9.4",
  "phonemizer-fork==3.3.2",
  "espeakng-loader==0.2.4",
  # Japanese (misaki.ja's cutlet path)
  "fugashi==1.5.2",
  "unidic-lite==1.0.8",
  "jaconv==0.5.0",
  "mojimoji==0.0.13",
  # Mandarin (misaki.zh's Kokoro 1.0 path)
  "jieba==0.42.1",
  "pypinyin==0.55.0",
  "cn2an==0.5.24",
  "ordered-set==4.1.0",
]

[tool.uv]
package = false
