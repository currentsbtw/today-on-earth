name: Snapshot

# Every 15 minutes: pull the newest GDELT GKG files, rebuild the static data files,
# build the site, and deploy it to GitHub Pages. The rolling-window state, the
# replay history and the per-cell daily baseline (state.json.gz, history.json.gz,
# baseline.json.gz) travel between runs through the
# Actions cache in the repo-root carry/ folder; they are never part of the site.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # prune old carry-* caches

# Never let two snapshots overlap; a queued run waits for the current one.
concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ingest/package-lock.json
            web/package-lock.json

      # Each run saves under a unique key; the prefix match restores the newest one.
      - name: Restore carried state
        id: carry
        uses: actions/cache/restore@v6
        with:
          path: carry
          key: carry-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: carry-
          # A miss (cache outage, evicted entry) fails the run unless the repository
          # variable ALLOW_COLD_START is "true" (first run, or a deliberate reset).
          fail-on-cache-miss: ${{ vars.ALLOW_COLD_START != 'true' }}

      - name: Report carry cache miss
        if: steps.carry.outputs.cache-matched-key == ''
        run: echo "::notice title=Cold start::No carried state in the Actions cache and ALLOW_COLD_START is true; this run cold-starts and begins a new replay history."

      - name: Ingest GDELT
        working-directory: ingest
        env:
          OUT_DIR: ../web/public/data
          CARRY_DIR: ../carry
        run: |
          npm ci
          npm run ingest

      - name: Save carried state
        if: success()
        uses: actions/cache/save@v6
        with:
          path: carry
          key: carry-${{ github.run_id }}-${{ github.run_attempt }}

      # Keep the 3 newest carry-* entries so the cache stays small; never fails the snapshot.
      - name: Prune old carried state
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --ref refs/heads/main --key carry- --json id,createdAt --limit 100 \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].id' |
          while read -r id; do
            gh cache delete "$id"
          done

      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Keeps snapshots (and the daily clip) flowing when GitHub's best-effort cron is silent,
  # which can last hours on a new repo.
  # - Every run sleeps a fixed 780 s, then dispatches the next snapshot unless any
  #   snapshot run (any event, any status) was created after this run was. A cron run
  #   that fired meanwhile, or a dispatch by someone else, therefore takes over the chain
  #   and this run stands down.
  # - It also dispatches clip.yml once a day: after 00:20 UTC, if no clip run was
  #   created yet that UTC day.
  # - Chained runs are workflow_dispatch events, one of the few events the GITHUB_TOKEN
  #   is allowed to create (it needs `actions: write`, granted above).
  # - The workflow-level concurrency group serialises everything: the dispatched run
  #   waits until this run ends. This job holds the group while it sleeps, so a cron run
  #   that fires meanwhile queues behind it; that is intended.
  # - The repo is public, so Actions minutes are unlimited and the sleeping job is free.
  # - To turn it off, set the repository variable KEEPALIVE to "false". The chain
  #   continues after a failed run on purpose (a transient failure must not stop
  #   snapshots overnight); a persistently failing run simply retries every 15 min.
  keepalive:
    needs: [build, deploy]
    if: ${{ !cancelled() && vars.KEEPALIVE != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Wait 13 minutes
        run: sleep 780

      - name: Dispatch the next snapshot
        run: |
          created=$(gh run view ${{ github.run_id }} --json createdAt --jq .createdAt)
          newer=$(gh run list --workflow snapshot.yml --created ">$created" --limit 20 \
            --json databaseId --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length")
          if [ "$newer" -gt 0 ]; then
            echo "A snapshot run was created after this one ($created); it continues the chain."
            exit 0
          fi
          for status in in_progress queued pending requested waiting; do
            others=$(gh run list --workflow snapshot.yml --status "$status" --limit 20 \
              --json databaseId --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length")
            if [ "$others" -gt 0 ]; then
              echo "Another snapshot run is already $status; not dispatching."
              exit 0
            fi
          done
          gh workflow run snapshot.yml --ref main
          echo "Dispatched the next snapshot run on main."

      - name: Dispatch the daily clip if it has not run today
        run: |
          today=$(date -u +%F)
          if [ "$(date -u +%H%M)" -lt 0020 ]; then
            echo "Before 00:20 UTC; today's clip is not due yet."
            exit 0
          fi
          runs=$(gh run list --workflow clip.yml --created ">=${today}T00:00:00Z" --limit 1 \
            --json databaseId --jq length)
          if [ "$runs" -gt 0 ]; then
            echo "A clip run already exists for $today."
            exit 0
          fi
          gh workflow run clip.yml --ref main
          echo "Dispatched the daily clip for $today."
