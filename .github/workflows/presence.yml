name: Presence

# Deploys the observers-count Worker in presence/ (see presence/README.md) to Cloudflare.
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; until they
# exist the deploy step logs "secrets not set; skipping" and the run passes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "presence/**"
      - ".github/workflows/presence.yml"

permissions:
  contents: read

concurrency:
  group: presence
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: presence
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: presence/package-lock.json

      - name: Test and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "secrets not set; skipping"; exit 0; }
          npm ci
          npm test
          npx wrangler deploy
