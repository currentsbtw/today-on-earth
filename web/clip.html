<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>Today On Earth · clip frame</title>
  </head>
  <body>
    <!-- Render target for a headless time-lapse renderer. Modes:
         ?t=<frame stamp>&w=1080&h=1920&dark=1[&max=<n>]  one replay frame
         ?signal=<slot id>&w&h[&max=<n>]                  one broadcast slot's card
         ?end=1&w&h[&max=<n>]                              the end card
         When the page is drawn, window.__clipReady is true and body has data-ready="1"
         (plus data-error="<reason>" on failure). -->
    <div id="clip" class="clip">
      <div id="clip-map" class="clip-map"></div>
      <!-- The text bands: black with the dot grid, over the map. The map shows between them,
           edged by two tick-marked hairlines. -->
      <div class="clip-band clip-band-top"></div>
      <div class="clip-band clip-band-bottom"></div>
      <div id="clip-edge-top" class="clip-edge clip-edge-top" aria-hidden="true"><div class="clip-ticks"></div></div>
      <div id="clip-edge-bottom" class="clip-edge clip-edge-bottom" aria-hidden="true"><div class="clip-ticks"></div></div>
      <header class="clip-top">
        <h1 class="clip-wordmark">
          <svg class="clip-globe" viewBox="0 0 16 16" shape-rendering="crispEdges" fill="#fff" aria-hidden="true"><rect x="7" y="0" width="2" height="1"/><rect x="4" y="1" width="3" height="1"/><rect x="9" y="1" width="3" height="1"/><rect x="3" y="2" width="1" height="1"/><rect x="5" y="2" width="2" height="1"/><rect x="9" y="2" width="2" height="1"/><rect x="12" y="2" width="1" height="1"/><rect x="2" y="3" width="1" height="1"/><rect x="13" y="3" width="1" height="1"/><rect x="1" y="4" width="6" height="1"/><rect x="9" y="4" width="6" height="1"/><rect x="1" y="5" width="1" height="1"/><rect x="14" y="5" width="1" height="1"/><rect x="1" y="6" width="14" height="1"/><rect x="0" y="7" width="16" height="1"/><rect x="0" y="8" width="16" height="1"/><rect x="1" y="9" width="14" height="1"/><rect x="1" y="10" width="1" height="1"/><rect x="14" y="10" width="1" height="1"/><rect x="1" y="11" width="6" height="1"/><rect x="9" y="11" width="6" height="1"/><rect x="2" y="12" width="1" height="1"/><rect x="13" y="12" width="1" height="1"/><rect x="3" y="13" width="1" height="1"/><rect x="5" y="13" width="2" height="1"/><rect x="9" y="13" width="2" height="1"/><rect x="12" y="13" width="1" height="1"/><rect x="4" y="14" width="3" height="1"/><rect x="9" y="14" width="3" height="1"/><rect x="7" y="15" width="2" height="1"/></svg>
          <span>Today On Earth</span>
        </h1>
        <p id="clip-time" class="clip-time"></p>
      </header>
      <div id="clip-counts" class="clip-counts"></div>
      <section id="clip-card" class="clip-card" hidden>
        <p id="clip-slot" class="clip-slot"></p>
        <p id="clip-line" class="clip-line"></p>
        <figure id="clip-quote" class="clip-quote">
          <blockquote><p id="clip-headline" class="clip-headline"></p></blockquote>
          <figcaption id="clip-outlet" class="clip-outlet"></figcaption>
        </figure>
      </section>
      <div id="clip-end" class="clip-end" hidden>
        <!-- The one-bit observer: end card only. -->
        <svg class="clip-observer" viewBox="0 0 12 14" shape-rendering="crispEdges" fill="#fff" aria-hidden="true"><rect x="11" y="0" width="1" height="1"/><rect x="10" y="1" width="2" height="1"/><rect x="3" y="2" width="4" height="1"/><rect x="9" y="2" width="2" height="1"/><rect x="2" y="3" width="6" height="1"/><rect x="9" y="3" width="1" height="1"/><rect x="2" y="4" width="2" height="1"/><rect x="5" y="4" width="4" height="1"/><rect x="2" y="5" width="6" height="1"/><rect x="3" y="6" width="4" height="1"/><rect x="2" y="7" width="6" height="1"/><rect x="1" y="8" width="8" height="1"/><rect x="0" y="9" width="1" height="1"/><rect x="3" y="9" width="4" height="1"/><rect x="9" y="9" width="1" height="1"/><rect x="3" y="10" width="4" height="1"/><rect x="3" y="11" width="1" height="1"/><rect x="6" y="11" width="1" height="1"/><rect x="3" y="12" width="1" height="1"/><rect x="6" y="12" width="1" height="1"/><rect x="2" y="13" width="2" height="1"/><rect x="6" y="13" width="2" height="1"/></svg>
        <div id="clip-end-text" class="clip-end-text">
          <p id="clip-cta" class="clip-cta">currentsbtw.github.io/today-on-earth</p>
        </div>
      </div>
    </div>
    <script type="module" src="./src/clip.ts"></script>
  </body>
</html>
