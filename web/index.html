<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050608" />
    <meta name="description" content="A map of where the world's news is pointing right now, rebuilt every 15 minutes from GDELT, with no editor and no feed." />
    <link rel="canonical" href="https://currentsbtw.github.io/today-on-earth/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Today On Earth" />
    <meta property="og:title" content="Today On Earth" />
    <meta property="og:description" content="A map of where the world's news is pointing right now, rebuilt every 15 minutes from GDELT, with no editor and no feed." />
    <meta property="og:url" content="https://currentsbtw.github.io/today-on-earth/" />
    <meta property="og:image" content="https://currentsbtw.github.io/today-on-earth/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A dark world map with amber glows where news coverage is concentrated." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Today On Earth" />
    <meta name="twitter:description" content="A map of where the world's news is pointing right now, rebuilt every 15 minutes from GDELT, with no editor and no feed." />
    <meta name="twitter:image" content="https://currentsbtw.github.io/today-on-earth/og.jpg" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%23050608%27/%3E%3Ccircle cx=%278%27 cy=%278%27 r=%274%27 fill=%27%23f2a64a%27/%3E%3C/svg%3E" />
    <title>Today On Earth</title>
  </head>
  <body>
    <header class="bar">
      <h1 class="wordmark">Today On Earth</h1>
      <p class="totals" id="totals" aria-live="polite"></p>
      <p class="mode-note" id="mode-note" hidden>vs. each place's 7-day normal</p>
      <span class="bar-spacer"></span>
      <div class="mode" id="mode" role="group" aria-label="Brightness" hidden>
        <button type="button" data-mode="articles" aria-pressed="true">articles</button>
        <button type="button" data-mode="normal" aria-pressed="false">vs. normal</button>
      </div>
      <button id="places-button" class="places-button" type="button" aria-controls="panel" aria-expanded="false" hidden>Places</button>
      <a class="about-link" href="./about.html" aria-label="How it works"><span class="about-text">How it works</span><span class="about-glyph" aria-hidden="true">?</span></a>
      <p class="snapshot" id="snapshot"></p>
    </header>
    <main class="stage">
      <div id="map" class="map" aria-label="World map of news coverage"></div>
      <div id="tooltip" class="tooltip" hidden></div>
      <p id="status" class="status" role="status">loading</p>
      <div id="scrubber" class="scrubber" role="group" aria-label="Replay" hidden>
        <button id="scrub-play" class="scrub-play" type="button" aria-label="Play">
          <svg class="icon-play" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7.5-4.5z" /></svg>
          <svg class="icon-pause" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 1.5h2.5v9H2.5zM7 1.5h2.5v9H7z" /></svg>
        </button>
        <div class="scrub-track">
          <div id="scrub-ticks" class="scrub-ticks" aria-hidden="true"></div>
          <input id="scrub-range" class="scrub-range" type="range" min="0" max="0" step="1" value="0" aria-label="Snapshot time" />
        </div>
        <p class="scrub-label"><span id="scrub-time"></span><span id="scrub-live" class="scrub-live">live</span></p>
      </div>
      <button id="quake-toggle" class="layer-toggle" type="button" aria-pressed="false" hidden>
        <svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.2" /></svg>
        <span>Quakes</span><span class="layer-state"></span>
      </button>
      <aside id="panel" class="panel" role="dialog" aria-modal="false" aria-labelledby="panel-title" hidden>
        <button id="sheet-handle" class="sheet-handle" type="button" aria-label="Expand details" aria-controls="panel" aria-expanded="false"><span aria-hidden="true"></span></button>
        <div class="panel-head">
          <h2 id="panel-title" class="panel-title" tabindex="-1"></h2>
          <button id="panel-close" class="panel-close" type="button" aria-label="Close">&times;</button>
        </div>
        <!-- List mode (the Places button): every place on the map as keyboard-reachable rows. -->
        <div id="panel-places" class="places">
          <input id="places-filter" class="places-filter" type="search" placeholder="Filter by name" aria-label="Filter places by name" autocomplete="off" spellcheck="false" />
          <p id="places-count" class="places-count"></p>
          <ol id="places-list" class="places-list"></ol>
        </div>
        <!-- Cell mode. -->
        <p id="panel-why" class="panel-why cell-only"></p>
        <p id="panel-reach" class="panel-reach cell-only" hidden></p>
        <p id="panel-note" class="panel-note cell-only" hidden></p>
        <div id="panel-coverage" class="coverage cell-only" hidden></div>
        <section id="panel-videos" class="videos cell-only" hidden></section>
        <div id="panel-stories" class="stories cell-only" hidden></div>
        <p id="panel-state" class="panel-state cell-only" hidden></p>
        <ol id="panel-list" class="articles cell-only"></ol>
      </aside>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
